# render.yaml — Render Blueprint for the auth service (auth/, docs/auth.md).
# Only the auth service is described here: the Laravel backend was created by
# hand on Render and keeps its own settings. Values marked `sync: false` are
# asked for when the Blueprint is created (copy them from the backend).
services:
  - type: web
    name: menupilot-auth
    runtime: docker
    rootDir: auth
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # The same secret on the Railway auth service and on both Laravel backends.
      - key: BETTER_AUTH_SECRET
        sync: false
      # Laravel's database: the values of the backend's DB_* variables.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AUTH_FALLBACK_URL
        value: https://menupilot.vercel.app
      - key: AUTH_CLIENT_IP_HEADER
        value: x-vercel-forwarded-for,x-forwarded-for
