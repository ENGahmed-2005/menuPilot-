<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" role="img" aria-labelledby="mp-title">
  <title id="mp-title">menuPilot</title>
  <defs>
    <!-- Gradient shared across all brand-mark shapes (userSpaceOnUse keeps direction consistent) -->
    <linearGradient id="og" x1="250" y1="10" x2="250" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFB957"/>
      <stop offset="55%"  stop-color="#F5821F"/>
      <stop offset="100%" stop-color="#D54A00"/>
    </linearGradient>
  </defs>

  <!-- ── QR Location Pin (top-center) ─────────────────────────────────── -->
  <!-- Teardrop: circle + pointing triangle -->
  <circle cx="250" cy="43" r="36" fill="url(#og)"/>
  <polygon points="234,68 266,68 250,96" fill="url(#og)"/>
  <!-- White QR-grid inside pin (2×2 blocks + strip) -->
  <rect x="232" y="24" width="11" height="11" rx="2" fill="white"/>
  <rect x="247" y="24" width="11" height="11" rx="2" fill="white"/>
  <rect x="232" y="39" width="11" height="11" rx="2" fill="white"/>
  <rect x="247" y="39" width="11" height="11" rx="2" fill="white"/>
  <rect x="261" y="24" width="6"  height="6"  rx="1" fill="white"/>
  <rect x="261" y="33" width="6"  height="6"  rx="1" fill="white"/>
  <rect x="261" y="42" width="6"  height="6"  rx="1" fill="white"/>

  <!-- ── M Brand Mark ───────────────────────────────────────────────────── -->

  <!-- Left outer column -->
  <rect x="60" y="100" width="42" height="130" rx="8" fill="url(#og)"/>
  <!-- Left diagonal arm (parallelogram: outer-top → inner-top) -->
  <polygon points="60,100 102,100 228,148 186,148" fill="url(#og)"/>
  <!-- Inner left column -->
  <rect x="186" y="148" width="42" height="82" rx="8" fill="url(#og)"/>

  <!-- Inner right column -->
  <rect x="272" y="148" width="42" height="82" rx="8" fill="url(#og)"/>
  <!-- Right diagonal arm (mirror) -->
  <polygon points="398,100 440,100 314,148 272,148" fill="url(#og)"/>
  <!-- Right outer column -->
  <rect x="398" y="100" width="42" height="130" rx="8" fill="url(#og)"/>

  <!-- ── NE Arrow (upper-right, connected to right outer column) ────────── -->
  <!--
    Shaft quadrilateral: from ~(415,95) toward (453,57), width 18px perpendicular.
    Direction (1,-1)/√2, perp (1,1)/√2, half-width 13 → offset ±9.
    Start corners: (415+9,95+9)=(424,104) and (415-9,95-9)=(406,86).
    End corners:   (453+9,57+9)=(462,66) and (453-9,57-9)=(444,48).
  -->
  <polygon points="406,86 424,104 462,66 444,48" fill="url(#og)"/>
  <!-- Arrowhead triangle at NE tip -->
  <polygon points="444,48 462,66 475,38" fill="url(#og)"/>

  <!-- ── Logotype: 'menu' dark + 'pilot' orange ─────────────────────────── -->
  <text
    y="318"
    font-family="'Nunito','Poppins','Segoe UI','Arial Rounded MT Bold',Arial,sans-serif"
    font-weight="900"
    font-size="80"
    text-anchor="middle"
    letter-spacing="-1"
  >
    <tspan x="250" fill="#1C2B3A">menu</tspan><tspan fill="#F5821F">pilot</tspan>
  </text>
</svg>
