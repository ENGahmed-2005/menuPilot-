<!doctype html>
<!--
  ============================================================================
  index.html — الصفحة الوحيدة في المشروع (Single Page Application)
  ----------------------------------------------------------------------------
  React لا يُنشئ ملفات HTML لكل صفحة. هذا الملف يُحمَّل مرة واحدة،
  ثم يبني React كل الواجهة داخل <div id="root"> عبر JavaScript.
  ============================================================================
-->
<html lang="ar" dir="rtl">
  <head>
    <!-- ترميز الحروف: UTF-8 ضروري حتى تظهر العربية بشكل صحيح -->
    <meta charset="UTF-8" />

    <!-- viewport: يجعل الصفحة تتكيّف مع عرض شاشة الجوال (تصميم متجاوب) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- الأيقونة في تبويب المتصفح. الملف في مجلد public،
         وكل ما في public يُقدَّم من الجذر "/" مباشرة -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- العنوان الظاهر في تبويب المتصفح ونتائج البحث -->
    <title>menuPilot — QR ordering, table by table</title>

    <!-- وصف الصفحة لمحركات البحث ومعاينات المشاركة -->
    <meta
      name="description"
      content="menuPilot turns a table's QR code into a live thread from phone to kitchen to cashier. No app to install, no order lost."
    />

    <!-- لون شريط المتصفح في الجوال (نفس لون خلفية الموقع) -->
    <meta name="theme-color" content="#1F2420" />

    <!-- preconnect: يفتح الاتصال بسيرفرات الخطوط مبكرًا فتظهر الخطوط أسرع -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- خطوط Google المستخدمة في التصميم:
         Instrument Serif → العناوين بالإنجليزي
         Inter            → النصوص بالإنجليزي
         Space Mono       → خط الآلة الكاتبة في تذكرة الطلب
         Cairo            → النصوص بالعربي
         Aref Ruqaa       → العناوين بالعربي -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- هذا الـ div فارغ تمامًا. React يملؤه أثناء التشغيل.
         لا تكتب داخله شيئًا يدويًا لأن React سيمسحه. -->
    <div id="root"></div>

    <!-- نقطة انطلاق الكود. type="module" يسمح باستخدام import/export.
         Vite يقرأ هذا السطر ليعرف من أين يبدأ بناء التطبيق. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
